[package]
name = "gitsave"
version = "0.1.26"
edition = "2024"

[features]
gui = ["dep:iced", "dep:rfd"]

[dependencies]
git2 = { version = "0.20", features = ["vendored-libgit2"] }
clap = { version = "4.4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
toml = "0.9"
dirs = "5.0"
anyhow = "1.0"
ratatui = { version = "0.26", default-features = false, features = ["crossterm"] }
crossterm = "0.27"
serde = { version = "1.0", features = ["derive"] }
globset = "0.4"
zip = "0.6"
iced = { version = "0.13", optional = true }
rfd = { version = "0.15", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
