name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # 创建 Release
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Gitsave ${{ github.ref_name }}
          body: |
            ## 下载
            
            ### Windows (x86_64)
            - `gitsave-windows-x86_64.exe`
            
            ### Linux (x86_64)
            - `gitsave-linux-x86_64`
            
            ### macOS (x86_64)
            - `gitsave-macos-x86_64`
            
            ## 快速开始
            
            ```bash
            # Windows
            gitsave.exe init
            gitsave.exe save "第一章完成"
            
            # Linux/macOS
            ./gitsave init
            ./gitsave save "第一章完成"
            ```
            
            ## 完整文档
            详见 [README.md](README.md)
          draft: false
          prerelease: false

  # 构建 Linux 版本
  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgit2-dev pkg-config
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Build Linux binary
        run: |
          cargo build --release
          cp target/release/gitsave gitsave-linux-x86_64
          chmod +x gitsave-linux-x86_64
      
      - name: Upload Linux binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./gitsave-linux-x86_64
          asset_name: gitsave-linux-x86_64
          asset_content_type: application/octet-stream

  # 构建 Windows 版本
  build-windows:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      
      - name: Install mingw
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64
      
      - name: Build Windows binary
        run: |
          cargo build --release --target x86_64-pc-windows-gnu
          cp target/x86_64-pc-windows-gnu/release/gitsave.exe gitsave-windows-x86_64.exe
      
      - name: Upload Windows binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./gitsave-windows-x86_64.exe
          asset_name: gitsave-windows-x86_64.exe
          asset_content_type: application/octet-stream

  # 构建 macOS 版本
  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          brew install libgit2
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Build macOS binary
        run: |
          cargo build --release
          cp target/release/gitsave gitsave-macos-x86_64
          chmod +x gitsave-macos-x86_64
      
      - name: Upload macOS binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./gitsave-macos-x86_64
          asset_name: gitsave-macos-x86_64
          asset_content_type: application/octet-stream

  # 构建 ARM64 macOS 版本 (Apple Silicon)
  build-macos-arm64:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          brew install libgit2
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      
      - name: Build macOS ARM64 binary
        run: |
          cargo build --release --target aarch64-apple-darwin
          cp target/aarch64-apple-darwin/release/gitsave gitsave-macos-arm64
          chmod +x gitsave-macos-arm64
      
      - name: Upload macOS ARM64 binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./gitsave-macos-arm64
          asset_name: gitsave-macos-arm64
          asset_content_type: application/octet-stream

  # 运行测试
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgit2-dev pkg-config
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Run tests
        run: |
          cargo build --release
          cp target/release/gitsave /tmp/gitsave
          chmod +x /tmp/gitsave
          export GITSAVE_BIN=/tmp/gitsave
          ./test_gitsave.sh
